services:
  web:
    build: .
    image: cs454-midterm:1.0.0
    environment:
      PORT: "8080"
      SERVICE_NAME: "cs454-midterm-compose"
      MESSAGE: "Hello from Docker Compose inside the Multipass VM"
    ports:
      # VM port 8080 (all VM interfaces) -> container port 8080
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
